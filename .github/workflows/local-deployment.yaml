name: Local Deployment on Ashok HP PC

on:
  push:
    branches:
      - dev
  pull_request:

env:
  APP_NAME: main-service
  ENV: dev
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin
  LOG_FILE: application.log
  HEALTH_CHECK_URL: http://localhost:9000/actuator/health
  TEST_ENDPOINT: http://localhost:9000/jackson/status-codes
  TIMEOUT: 60
  MY_SECRET: ${{ secrets.MY_SECRET }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Verify Java and Maven installation
        run: |
          java --version
          mvn --version
          where.exe java
          where.exe mvn

      - name: Build and test with Maven
        run: mvn clean install

      - name: Deploy ${{ env.APP_NAME }} to ${{ env.ENV }} environment
        shell: cmd
        run: |
          echo "Deploying ${{ env.APP_NAME }} to ${{ env.ENV }} environment..."

          nohup java -jar target/*.jar > "${{ env.LOG_FILE }}" 2>&1 &

          echo $! > application.pid

          echo "${{ env.APP_NAME }} Application PID: $(cat application.pid)"

      - name: Wait for ${{ env.APP_NAME }} application
        shell: cmd
        run: |
          echo "Waiting for ${{ env.APP_NAME }} application to start..."

          for i in $(seq 1 ${{ env.TIMEOUT }}); do
            if curl -s "${{ env.HEALTH_CHECK_URL }}" > /dev/null; then
              echo "${{ env.APP_NAME }} application is ready!"
              exit 0
            fi

            if ! kill -0 "$(cat application.pid)" 2>/dev/null; then
              echo "${{ env.APP_NAME }} application process has stopped!"
              echo "===== APPLICATION LOG ====="
              cat "${{ env.LOG_FILE }}"
              echo "============================"
              exit 1
            fi

            echo "Waiting... ($i/${{ env.TIMEOUT }})"
            sleep 2
          done

          echo "${{ env.APP_NAME }} application failed to start within ${{ env.TIMEOUT }} seconds."
          echo "===== APPLICATION LOG ====="
          cat "${{ env.LOG_FILE }}"
          echo "============================"

          exit 1

      - name: Hit ${{ env.APP_NAME }} endpoint
        run: |
          curl -v "${{ env.TEST_ENDPOINT }}"