name: Deploy on Ashok HP PC

on:
  workflow_dispatch:

env:
  APP_NAME: main-service
  ENV: local
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin
  PID_FILE: application.pid
  HEALTH_CHECK_URL: http://localhost:9000/actuator/health
  TEST_ENDPOINT: http://localhost:9000/jackson/status-codes
  TIMEOUT: 60
  MY_SECRET: ${{ secrets.MY_SECRET }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      - name: Verify Java and Maven installation
        shell: powershell
        run: |
          java --version
          mvn --version
          where.exe java
          where.exe mvn

      - name: Build and test with Maven
        shell: powershell
        run: |
          mvn clean install

      - name: Deploy ${{ env.APP_NAME }} to ${{ env.ENV }} environment
        shell: powershell
        run: |
          Write-Host "Deploying $env:APP_NAME to $env:ENV environment..."
          
          # Find the application JAR
          $jar = Get-ChildItem "target\*.jar" |
            Where-Object {
              $_.Name -notmatch '(-sources|-javadoc|-original)\.jar$'
            } |
            Select-Object -First 1
          
          if (-not $jar) {
            Write-Error "No application JAR found in target directory."
            exit 1
          }
          
          Write-Host "Starting JAR: $($jar.FullName)"
          
          # Stop existing application
          if (Test-Path $env:PID_FILE) {
            $oldPid = Get-Content $env:PID_FILE
          
            if ($oldPid) {
              Write-Host "Stopping existing application with PID $oldPid..."
          
              Stop-Process `
                -Id ([int]$oldPid) `
                -Force `
                -ErrorAction SilentlyContinue
          
              Start-Sleep -Seconds 2
            }
          
            Remove-Item $env:PID_FILE -Force -ErrorAction SilentlyContinue
          }
          
          # Log files
          $stdoutLog = "application.stdout.log"
          $stderrLog = "application.stderr.log"
          
          # Remove old logs
          Remove-Item $stdoutLog -Force -ErrorAction SilentlyContinue
          Remove-Item $stderrLog -Force -ErrorAction SilentlyContinue
          
          # Start application
          $process = Start-Process `
            -FilePath "java" `
            -ArgumentList "-jar `"$($jar.FullName)`"" `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru `
            -WindowStyle Hidden
          
          if (-not $process) {
            Write-Error "Failed to start application."
            exit 1
          }
          
          # Save PID
          $process.Id | Out-File `
            -FilePath $env:PID_FILE `
            -Encoding ascii
          
          Write-Host "$env:APP_NAME Application PID: $($process.Id)"

      - name: Wait for ${{ env.APP_NAME }} application
        shell: powershell
        run: |
          Write-Host "Waiting for $env:APP_NAME application to start..."

          $started = $false

          # TIMEOUT is in seconds
          $interval = 2
          $maxAttempts = [math]::Ceiling(
            [int]$env:TIMEOUT / $interval
          )

          for ($i = 1; $i -le $maxAttempts; $i++) {

            # Check health endpoint
            try {
              $response = Invoke-WebRequest `
                -Uri $env:HEALTH_CHECK_URL `
                -UseBasicParsing `
                -TimeoutSec 2 `
                -ErrorAction Stop

              if ($response.StatusCode -eq 200) {
                Write-Host "$env:APP_NAME application is ready!"
                $started = $true
                break
              }
            }
            catch {
              # Application isn't ready yet
            }

            # Check whether Java process is still running
            if (Test-Path $env:PID_FILE) {
              $appPid = Get-Content $env:PID_FILE

              if ($appPid) {
                $process = Get-Process `
                  -Id ([int]$appPid) `
                  -ErrorAction SilentlyContinue

                if (-not $process) {
                  Write-Host "$env:APP_NAME application process has stopped!"

                  Write-Host "===== STDOUT LOG ====="

                  if (Test-Path "application.stdout.log") {
                    Get-Content "application.stdout.log"
                  }

                  Write-Host "===== STDERR LOG ====="

                  if (Test-Path "application.stderr.log") {
                    Get-Content "application.stderr.log"
                  }

                  Write-Host "======================"

                  exit 1
                }
              }
            }

            Write-Host "Waiting... ($i/$maxAttempts)"
            Start-Sleep -Seconds $interval
          }

          if (-not $started) {
            Write-Host "$env:APP_NAME application failed to start within $env:TIMEOUT seconds."

            Write-Host "===== STDOUT LOG ====="

            if (Test-Path "application.stdout.log") {
              Get-Content "application.stdout.log"
            }

            Write-Host "===== STDERR LOG ====="

            if (Test-Path "application.stderr.log") {
              Get-Content "application.stderr.log"
            }

            Write-Host "======================"

            exit 1
          }

      - name: Hit ${{ env.APP_NAME }} endpoint
        shell: powershell
        run: |
          Write-Host "Testing $env:TEST_ENDPOINT..."
          
          try {
            Invoke-WebRequest `
              -Uri $env:TEST_ENDPOINT `
              -UseBasicParsing `
              -TimeoutSec 10 `
              -ErrorAction Stop
          
            Write-Host "Endpoint test successful!"
          }
          catch {
            Write-Error "Endpoint test failed: $($_.Exception.Message)"
            exit 1
          }