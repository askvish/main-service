name: Deploy Main Application to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - dev

  pull_request:

env:
  APP_NAME: ${{ github.event.repository.name }}
  ENV: AWS
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin

  TARGET_DIR: /home/ubuntu/${{ github.event.repository.name }}

  JAR_FILE: app.jar
  PID_FILE: application.pid
  LOG_FILE: application.log

  TIMEOUT: 60

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout ${{ github.event.ref }} branch of ${{ github.event.repository.name }} repository
        uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRIBUTION }})
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build ${{ env.APP_NAME }} with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

           cp target/*.jar app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: app.jar

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: AWS
    needs: build

    # Do not deploy pull requests.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')

    permissions:
      contents: read

    steps:
      - name: Check directory structure before downloading artifact
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -lah

      - name: Download JAR file
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: .

      - name: Verify JAR file
        run: |
          echo "Contents of:"
          pwd
          ls -lah 
          file app.jar
          test -f app.jar

      - name: Copy JAR file to EC2 using SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app.jar
          target: ${{ env.TARGET_DIR }}
          overwrite: true

      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1
        env:
          API_KEY: ${{ secrets.API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_KEY
          script: |
            set -e

            APP_DIR="${{ env.TARGET_DIR }}"
            JAR="$APP_DIR/${{ env.JAR_FILE }}"
            PID_FILE="$APP_DIR/${{ env.PID_FILE }}"
            LOG_FILE="$APP_DIR/${{ env.LOG_FILE }}"

            echo "Application directory: $APP_DIR"
            echo "JAR: $JAR"

            # Stop existing application
            if [ -f "$PID_FILE" ]; then
              PID=$(cat "$PID_FILE")

              if kill -0 "$PID" 2>/dev/null; then
                echo "Stopping application with PID $PID..."
                kill "$PID"

                # Wait up to 30 seconds for graceful shutdown
                for i in $(seq 1 30); do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi

                  sleep 1
                done

                # Force kill if still running
                if kill -0 "$PID" 2>/dev/null; then
                  echo "Application did not stop gracefully. Force killing..."
                  kill -9 "$PID"
                fi
              fi

              rm -f "$PID_FILE"
            fi

            # Verify JAR exists
            if [ ! -f "$JAR" ]; then
              echo "ERROR: JAR not found: $JAR"
              exit 1
            fi

            # Start application
            echo "Starting application..."

            nohup java -jar "$JAR" > "$LOG_FILE" 2>&1 &

            NEW_PID=$!
            echo "$NEW_PID" > "$PID_FILE"

            echo "${{ env.APP_NAME }} Application started with PID: $NEW_PID"

            # Give Java a moment to start
            sleep 5

            if ! kill -0 "$NEW_PID" 2>/dev/null; then
              echo "ERROR: Application failed to start."
              echo "===== APPLICATION LOG ====="
              tail -100 "$LOG_FILE"
              echo "==========================="
              rm -f "$PID_FILE"
              exit 1
            fi

            echo "${{ env.APP_NAME }} Application started successfully."
            echo "API Key: $API_KEY"