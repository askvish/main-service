name: Hello Workflow

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show repository
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Show working directory
        run: pwd

      - name: List files
        run: ls -al