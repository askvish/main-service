name: Hello Workflow

on:
  push:
    branches:
      - dev
  pull_request:

env:
  APP_NAME: main-service

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test with Maven
        run: mvn clean install

      - name: Start Spring Boot application
        run: |
          nohup java -jar target/*.jar > application.log 2>&1 &

      - name: Wait for application to start
        run: |
          echo "Waiting for application..."

          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Application failed to start."
          cat application.log
          exit 1

      - name: Hit application endpoint
        run: |
          curl -v https://localhost:9000/jackson/status-codes

      - name: Show secret availability
        run: |
          echo "MY_SECRET is configured: ${{ secrets.MY_SECRET != '' }}"
          echo "API_KEY is configured: ${{ secrets.API_KEY != '' }}"