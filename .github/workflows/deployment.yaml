name: Hello Workflow

on:
  push:
    branches:
      - dev
  pull_request:

env:
  APP_NAME: main-service

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show working directory
        run: pwd

      - name: Show files in the repository
        run: ls -la

      - name: Show all information
        run: |
          echo "Application Name: $APP_NAME"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test with Maven
        run: mvn clean install

      - name: Show test summary
        if: always()
        shell: bash
        run: |
          echo "Test Summary:"
          
          if compgen -G "target/surefire-reports/TEST-*.xml" > /dev/null; then
            grep -E "<testsuite|<testcase" target/surefire-reports/TEST-*.xml || true
          else
            echo "No test summary found."
          fi

      - name: Show secret availability
        run: |
          echo "MY_SECRET is configured: ${{ secrets.MY_SECRET != '' }}"
          echo "API_KEY is configured: ${{ secrets.API_KEY != '' }}"