name: Hello Workflow

on:
  push:
    branches:
      - dev
  pull_request:

env:
  APP_NAME: main-service

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test with Maven
        run: mvn clean install

      - name: Start Spring Boot application
        shell: bash
        run: |
          echo "Starting Spring Boot application..."

          nohup java -jar target/*.jar --server.address=0.0.0.0 > application.log 2>&1 &

          echo $! > application.pid

          echo "Application PID: $(cat application.pid)"

      - name: Wait for Spring Boot application
        shell: bash
        run: |
          echo "Waiting for application to start..."

          for i in {1..60}; do
            if curl -s http://localhost:9000/actuator/health > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            if ! kill -0 "$(cat application.pid)" 2>/dev/null; then
              echo "Application process has stopped!"
              echo "===== APPLICATION LOG ====="
              cat application.log
              echo "============================"
              exit 1
            fi

            echo "Waiting... ($i/60)"
            sleep 2
          done

          echo "Application failed to start within 120 seconds."
          echo "===== APPLICATION LOG ====="
          cat application.log
          echo "============================"

          exit 1

      - name: Hit application endpoint
        run: |
          curl -v http://localhost:9000/jackson/status-codes

      - name: Show secret availability
        run: |
          echo "MY_SECRET is configured: ${{ secrets.MY_SECRET != '' }}"
          echo "API_KEY is configured: ${{ secrets.API_KEY != '' }}"